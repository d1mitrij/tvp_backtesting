# ── CO2 limits — divergent by development level ────────────────────────────
# Europe: strict (consistent with wealthy, high-institution trajectory;
#   Rail_EU_DEV signals strong policy capacity)
# Asia: intermediate (urban areas strict, rural areas effectively unconstrained)
# Africa: very loose (no capital for transition; limited enforcement capacity)
# LATAM: intermediate-loose (bifurcated economy)
impacts:
  - id: CO2
    penalty:
      Africa: {"*": 8}
      Asia:   {"*": 28}
