# ─── SSP4-6.0 — Inequality ────────────────────────────────────────────────────
# Narrative: stark inequality between and within countries. High-tech,
# capital-intensive energy systems in wealthy regions (Europe, urban Asia);
# labour-intensive, fossil-dependent systems in low-income regions (Africa,
# rural Asia, parts of LATAM). ~3 °C trajectory.
#
# Project links:
#   Africa Proj_002 ($25M, 3 000 specialised patients) reflects limited
#   capital access — hospital serves a tiny elite; most of the population
#   lacks reliable electricity. Hydro_AF retrofit is a rare capital inflow.
#   LATAM Proj_001 ($250M, 5 M primary patients) reflects more equitable
#   access within LATAM (urban/rural split but better than Africa).
#   Europe and wealthy Asia converge rapidly; Africa diverges.
#
# Key SSP4 distinction from SSP3:
#   SSP3 = global fragmentation (all regions suffer)
#   SSP4 = polarised (wealthy regions decarbonise, poor ones lag)
#
# Merges with base.yaml via Model.from_yaml("base.yaml", "ssp4.yaml").

# ── Electricity demand [PJ/yr] ─────────────────────────────────────────────
# Africa: slow growth constrained by poverty, limited grid access
# Asia: polarised — urban high-income growth, rural stagnation; net moderate
# Europe: efficiency-driven stabilisation (wealthy, strong institutions)
# LATAM: bifurcated; urban Brazil/Mexico grow, rural areas stagnate
commodities:
  - id: ELC
    include_in_joint_renewable_target:
      "*":
        "*": true
    demand_annual:
      Africa:
        "2020": 2500
        "2025": 2720
        "2030": 2950
        "2035": 3200
        "2040": 3470
        "2045": 3760
        "2050": 4070
