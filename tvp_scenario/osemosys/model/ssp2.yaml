# ─── SSP2-4.5 — Middle of the Road ───────────────────────────────────────────
# Narrative: current socioeconomic trends continue, uneven progress,
# moderate population growth. CO2 limits tighten gradually; renewable
# transition is market-led and policy-assisted. ~2 °C trajectory.
#
# Project links:
#   All three project types are mid-cycle: hospitals expanding access
#   (Africa Proj_002, LATAM Proj_001), rail modernising (Rail_EU_DEV),
#   hydro retrofitting (all three projects deployed on schedule).
#
# Merges with base.yaml via Model.from_yaml("base.yaml", "ssp2.yaml").

