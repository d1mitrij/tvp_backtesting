id: remind-magpie-osemosys
long_name: "REMIND-MAgPIE S4 Scenarios — OSeMOSYS Regional Energy System Model"

# ─── Temporal horizon ────────────────────────────────────────────────────────
# 2020–2050 in 5-year steps (REMIND-MAgPIE standard resolution)
time_definition:
  id: td
  years: [2020, 2025, 2030, 2035, 2040, 2045, 2050]

# ─── Regions ─────────────────────────────────────────────────────────────────
# Names match modeled_input_data/ CSVs exactly.
#
# Project coverage:
#   Africa  — hospitals (Proj_002, $25M, 3 000 spec. patients)
#             hydro    (Hydro_AF, $30M, 150 000 tCO2 avoided)
#   Asia    — hydro    (Hydro_AS, $150M, 834 218 tCO2 avoided)
#   Europe  — hospitals (Proj_003, $75M, 500 000 patients)
#             hydro    (Hydro_EU, $2M, 6 126 tCO2 avoided)
#             rail     (Rail_EU_DEV, €1.85B, 5.5M pax/yr)
#   LATAM   — hospitals (Proj_001, $250M, 5 000 000 patients)
regions:
  - id: Africa
  - id: Asia
  - id: Europe
  - id: LATAM

# ─── Model-level assumptions ─────────────────────────────────────────────────
discount_rate: 0.05

# ─── Commodities ─────────────────────────────────────────────────────────────
# ELC demand_annual is overridden per SSP scenario file.
# Europe demand includes the 0.099 PJ/yr rail electrification increment
# (Rail_EU_DEV: 5.5M pax × 5 kWh/pax × 3.6e-9 PJ/kWh).
commodities:
  - id: ELC
    include_in_joint_renewable_target:
      "*":
        "*": true

# ─── Impacts ─────────────────────────────────────────────────────────────────
# Background carbon price [M$/Mt CO2 = $/tonne CO2]. Binding CO2 constraints
# (constraint_annual) are overridden in each SSP scenario file.
# Prices reflect 2020 institutional capacity: Europe highest (strong policy,
# rail infrastructure), Africa lowest (limited capital access per Proj_002).
impacts:
  - id: CO2
    penalty:
      Africa: {"*": 15}
      Asia:   {"*": 20}
      Europe: {"*": 60}
      LATAM:  {"*": 25}

# ─── Technologies ────────────────────────────────────────────────────────────
# Unit system:
#   capacity_activity_unit_ratio = 31.536  →  1 GW at 100 % CF = 31.536 PJ/yr
#   capex            [M$/GW]
#   opex_fixed       [M$/GW/yr]
#   opex_variable    [M$/PJ electricity]
#   emission_activity_ratio  [Mt CO2/PJ electricity]
#   residual_capacity        [GW]  — linear retirement over operating_life from 2020
technologies:

  # ── Coal Power Plants ──────────────────────────────────────────────────────
  # REGIONAL EMISSION FACTORS derived from avoided-CO2 data in hydro_finance_input.csv:
  #   Africa:  150 000 tCO2 / (30 MW × 40 % CF × 8 760 h) = 0.3964 Mt CO2/PJ
  #   Asia:    834 218 tCO2 / (150 MW × 38 % CF × 8 760 h) = 0.4641 Mt CO2/PJ
  #   Europe:    6 126 tCO2 / (2 MW × 35 % CF × 8 760 h)  = 0.2775 Mt CO2/PJ
  #   LATAM:   no project → estimated 0.2200 Mt CO2/PJ (gas-heavy marginal grid)
  #
  # Residual capacity declines linearly to 0 over 30-year operating life.
  - id: COAL_PP
    operating_life: 30
    capacity_activity_unit_ratio: 31.536
    capex:
      Africa: {"*": 1600}
      Asia:   {"*": 1300}
      Europe: {"*": 1500}
      LATAM:  {"*": 1500}
    opex_fixed:
      "*": {"*": 30.0}
    capacity_factor:
      "*": {"*": 0.60}
    residual_capacity:
      Africa:
        "2020": 65.0
        "2025": 54.2
        "2030": 43.3
        "2035": 32.5
        "2040": 21.7
        "2045": 10.8
        "2050": 0.0
      Asia:
        "2020": 350.0
        "2025": 291.7
        "2030": 233.3
        "2035": 175.0
        "2040": 116.7
        "2045": 58.3
        "2050": 0.0
      Europe:
        "2020": 100.0
        "2025": 83.3
        "2030": 66.7
        "2035": 50.0
        "2040": 33.3
        "2045": 16.7
        "2050": 0.0
      LATAM:
        "2020": 35.0
        "2025": 29.2
        "2030": 23.3
        "2035": 17.5
        "2040": 11.7
        "2045": 5.8
        "2050": 0.0
    operating_modes:
      - id: GEN
        opex_variable: {"*": {"*": 5.0}}
        output_activity_ratio: {"*": {"ELC": {"*": 1.0}}}
        emission_activity_ratio:
          Africa: {"CO2": {"*": 0.3964}}
          Asia:   {"CO2": {"*": 0.4641}}
          Europe: {"CO2": {"*": 0.2775}}
          LATAM:  {"CO2": {"*": 0.2200}}

  # ── Gas Combined Cycle (CCGT) ──────────────────────────────────────────────
  # Emission factor: 56 g CO2/MJ gas / 0.55 efficiency = 0.102 Mt CO2/PJ
  # Residual retires over 25-year life from 2020 baseline.
  - id: GAS_PP
    operating_life: 25
    capacity_activity_unit_ratio: 31.536
    capex:
      Africa: {"*": 1000}
      Asia:   {"*": 850}
      Europe: {"*": 900}
      LATAM:  {"*": 900}
    opex_fixed:
      "*": {"*": 15.0}
    capacity_factor:
      "*": {"*": 0.45}
    residual_capacity:
      Africa:
        "2020": 15.0
        "2025": 12.0
        "2030": 9.0
        "2035": 6.0
        "2040": 3.0
        "2045": 0.0
        "2050": 0.0
      Asia:
        "2020": 120.0
        "2025": 96.0
        "2030": 72.0
        "2035": 48.0
        "2040": 24.0
        "2045": 0.0
        "2050": 0.0
      Europe:
        "2020": 250.0
        "2025": 200.0
        "2030": 150.0
        "2035": 100.0
        "2040": 50.0
        "2045": 0.0
        "2050": 0.0
      LATAM:
        "2020": 80.0
        "2025": 64.0
        "2030": 48.0
        "2035": 32.0
        "2040": 16.0
        "2045": 0.0
        "2050": 0.0
    operating_modes:
      - id: GEN
        opex_variable: {"*": {"*": 8.0}}
        output_activity_ratio: {"*": {"ELC": {"*": 1.0}}}
        emission_activity_ratio: {"*": {"CO2": {"*": 0.102}}}

  # ── Existing Hydro Fleet ───────────────────────────────────────────────────
  # Long-lived assets (60-yr operating life); residual capacity declines
  # slowly at 1/60 of 2020 fleet per year.
  # capacity_additional_max = 0 is mandatory: prevents the optimiser from
  # treating the near-zero capex as a free energy source. New hydro
  # investment is exclusively through HYDRO_RETRO (project-linked).
  # Lifecycle CO2 = 0.003 Mt/PJ (reservoir methane estimate).
  - id: HYDRO_EXIST
    operating_life: 60
    capacity_activity_unit_ratio: 31.536
    capex:
      "*": {"*": 0.001}
    opex_fixed:
      "*": {"*": 15.0}
    capacity_factor:
      Africa: {"*": 0.40}
      Asia:   {"*": 0.38}
      Europe: {"*": 0.35}
      LATAM:  {"*": 0.45}
    residual_capacity:
      Africa:
        "2020": 40.0
        "2025": 38.3
        "2030": 36.7
        "2035": 35.0
        "2040": 33.3
        "2045": 31.7
        "2050": 30.0
      Asia:
        "2020": 150.0
        "2025": 143.8
        "2030": 137.5
        "2035": 131.3
        "2040": 125.0
        "2045": 118.8
        "2050": 112.5
      Europe:
        "2020": 220.0
        "2025": 211.7
        "2030": 203.3
        "2035": 195.0
        "2040": 186.7
        "2045": 178.3
        "2050": 170.0
      LATAM:
        "2020": 185.0
        "2025": 177.6
        "2030": 170.2
        "2035": 162.8
        "2040": 155.4
        "2045": 148.0
        "2050": 140.6
    capacity_additional_max:
      "*": {"*": 0.0}
    include_in_joint_renewable_target:
      "*": {"*": true}
    operating_modes:
      - id: GEN
        opex_variable: {"*": {"*": 0.5}}
        output_activity_ratio: {"*": {"ELC": {"*": 1.0}}}
        emission_activity_ratio: {"*": {"CO2": {"*": 0.003}}}

  # ── Hydro Retrofit — Project-linked ───────────────────────────────────────
  # Capex = 1 000 M$/GW ($1 000/kW, assumptions.txt: turbine runner, governor,
  # generator rewinding). capacity_additional_max is derived from project budgets
  # in hydro_finance_input.csv via derive_parameters.py:
  #   Africa: $30M / $1 000/kW = 30 MW = 0.030 GW  (Hydro_AF, Refurbishment)
  #   Asia:  $150M / $1 000/kW = 150 MW = 0.150 GW  (Hydro_AS, Large_Scale_Retrofit)
  #   Europe:  $2M / $1 000/kW =   2 MW = 0.002 GW  (Hydro_EU, Efficiency_Tweak)
  #   LATAM: no project — 0.000 GW
  - id: HYDRO_RETRO
    operating_life: 40
    capacity_activity_unit_ratio: 31.536
    capex:
      "*": {"*": 1000.0}
    opex_fixed:
      "*": {"*": 10.0}
    capacity_factor:
      Africa: {"*": 0.40}
      Asia:   {"*": 0.38}
      Europe: {"*": 0.35}
      LATAM:  {"*": 0.45}
    capacity_additional_max:
      Africa:
        "2020": 0.0
        "2025": 0.030
        "2030": 0.030
        "2035": 0.030
        "2040": 0.030
        "2045": 0.030
        "2050": 0.030
      Asia:
        "2020": 0.0
        "2025": 0.150
        "2030": 0.150
        "2035": 0.150
        "2040": 0.150
        "2045": 0.150
        "2050": 0.150
      Europe:
        "2020": 0.0
        "2025": 0.002
        "2030": 0.002
        "2035": 0.002
        "2040": 0.002
        "2045": 0.002
        "2050": 0.002
      LATAM:
        "2020": 0.0
        "2025": 0.0
        "2030": 0.0
        "2035": 0.0
        "2040": 0.0
        "2045": 0.0
        "2050": 0.0
    include_in_joint_renewable_target:
      "*": {"*": true}
    operating_modes:
      - id: GEN
        opex_variable: {"*": {"*": 0.5}}
        output_activity_ratio: {"*": {"ELC": {"*": 1.0}}}
        emission_activity_ratio: {"*": {"CO2": {"*": 0.003}}}

  # ── Utility-Scale Solar PV ─────────────────────────────────────────────────
  # Learning-curve capex decline (~18 % per doubling of cumulative capacity).
  # Capacity factors reflect regional insolation (Africa and LATAM highest).
  - id: SOLAR_PV
    operating_life: 25
    capacity_activity_unit_ratio: 31.536
    capex:
      "*":
        "2020": 1200
        "2025": 850
        "2030": 600
        "2035": 480
        "2040": 400
        "2045": 360
        "2050": 340
    opex_fixed:
      "*": {"*": 12.0}
    capacity_factor:
      Africa: {"*": 0.25}
      Asia:   {"*": 0.22}
      Europe: {"*": 0.15}
      LATAM:  {"*": 0.23}
    include_in_joint_renewable_target:
      "*": {"*": true}
    operating_modes:
      - id: GEN
        opex_variable: {"*": {"*": 0.001}}
        output_activity_ratio: {"*": {"ELC": {"*": 1.0}}}

  # ── Onshore Wind ───────────────────────────────────────────────────────────
  # Declining capex; capacity factors reflect regional wind resources.
  - id: WIND
    operating_life: 25
    capacity_activity_unit_ratio: 31.536
    capex:
      "*":
        "2020": 1600
        "2025": 1250
        "2030": 1000
        "2035": 850
        "2040": 750
        "2045": 700
        "2050": 670
    opex_fixed:
      "*": {"*": 25.0}
    capacity_factor:
      Africa: {"*": 0.32}
      Asia:   {"*": 0.27}
      Europe: {"*": 0.30}
      LATAM:  {"*": 0.29}
    include_in_joint_renewable_target:
      "*": {"*": true}
    operating_modes:
      - id: GEN
        opex_variable: {"*": {"*": 0.001}}
        output_activity_ratio: {"*": {"ELC": {"*": 1.0}}}
