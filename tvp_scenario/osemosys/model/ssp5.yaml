# ── CO2 limits — very loose, consistent with 8.5 W/m² forcing ────────────
# All regions are resource-rich and fossil-energy-dependent through 2050.
# Limits set at multiples of business-as-usual to avoid infeasibility while
# reflecting the near-total absence of binding climate policy.
# New coal and gas plants are built at scale in Africa and Asia.
impacts:
  - id: CO2
    penalty:
      Africa: {"*": 3}
      Asia:   {"*": 3}
      Europe: {"*": 8}
      LATAM:  {"*": 4}
    constraint_annual:
      Africa:
