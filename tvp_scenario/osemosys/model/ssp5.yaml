# ─── SSP5-8.5 — Fossil-Fueled Development ────────────────────────────────────
# Narrative: rapid economic growth globally, driven by fossil fuels and high
# investment in human capital (education and health). Very high energy demand;
# late emissions peak; high adaptive capacity but severe physical climate risks.
# ~4–5 °C trajectory.
#
# Project links:
#   LATAM Proj_001 ($250M, 5 M patients) and Africa Proj_002 ($25M) reflect
#   the high human-capital investment in this pathway — health and education
#   spending is a hallmark of SSP5 even in developing regions.
#   Hydro retrofits are deployed (economic growth enables investment), but coal
#   and gas capacity expands massively to meet rapidly growing demand.
#   Rail_EU_DEV is one of many large European infrastructure projects in an
#   era of high growth and high energy consumption.
#
# Key SSP5 distinction from SSP3:
#   SSP3 = fragmented (weak institutions, slow growth everywhere)
#   SSP5 = globalised fossil growth (strong institutions, high growth,
#          coordinated fossil investment; renewables grow but fossil dominates)
#
# Merges with base.yaml via Model.from_yaml("base.yaml", "ssp5.yaml").

# ── Electricity demand [PJ/yr] — very high growth everywhere ──────────────
commodities:
  - id: ELC
    include_in_joint_renewable_target:
      "*":
        "*": true
    demand_annual:
      Africa:
        "2020": 2500
        "2025": 3350
        "2030": 4550
        "2035": 6100
        "2040": 8100
        "2045": 10600
        "2050": 13800
      Asia:
