# ─── SSP1-1.9 — Sustainability ────────────────────────────────────────────────
# Narrative: rapid transition toward human well-being, reduced inequality,
# low resource intensity, global cooperation. Electricity demand grows
# moderately (efficiency gains offset growth); strict CO2 limits force deep
# decarbonisation by 2045. Renewable share ≥ 95 % in most regions by 2050.
#
# Project links:
#   Rail_EU_DEV (€1.85B) and hospital Proj_003 reflect the institutional
#   capacity and policy ambition consistent with SSP1 in Europe.
#   Hydro retrofits are deployed fully and early in this pathway.
#
# Merges with base.yaml via Model.from_yaml("base.yaml", "ssp1.yaml").

# ── Electricity demand [PJ/yr] ─────────────────────────────────────────────
# Africa: moderate growth — health system investment (Proj_002) raises
#   living standards and energy access but efficiency limits peak demand.
# Asia: peak demand moderates after 2040 through efficiency programmes.
# Europe: slight efficiency-driven decline post-2030; rail electrification
#   (0.099 PJ/yr Rail_EU_DEV) is embedded in the 2025+ trajectory.
# LATAM: primary health care (Proj_001, $250M) raises incomes; efficiency
#   slows demand growth after 2035.
commodities:
  - id: ELC
    include_in_joint_renewable_target:
      "*":
        "*": true
    demand_annual:
      Africa:
        "2020": 2500
        "2025": 2950
        "2030": 3400
        "2035": 3880
        "2040": 4350
        "2045": 4880
        "2050": 5450
      Asia:
        "2020": 10000
        "2025": 11500
        "2030": 12950
        "2035": 13900
        "2040": 14600
        "2045": 15000
        "2050": 15250
      Europe:
        "2020": 12000
        "2025": 12200
        "2030": 12050
        "2035": 11600
        "2040": 11100
        "2045": 10650
        "2050": 10200
      LATAM:
        "2020": 4500
        "2025": 5020
        "2030": 5540
        "2035": 6050
        "2040": 6540
        "2045": 7010
        "2050": 7450

# ── CO2 emission limits [Mt CO2/yr] + carbon prices ───────────────────────
# Calibrated to IPCC AR6 1.5 °C carbon budget (C1 scenarios).
# Africa limits reflect a just-transition allowance: higher near-term budget
# to allow development, steeper decline post-2035.
# Europe limits are tightest, consistent with EU institutional capacity
# signalled by Rail_EU_DEV infrastructure investment.
impacts:
  - id: CO2
    penalty:
      Africa: {"*": 80}
      Asia:   {"*": 65}
      Europe: {"*": 120}
      LATAM:  {"*": 80}
