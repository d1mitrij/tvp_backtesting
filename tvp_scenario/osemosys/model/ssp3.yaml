# ─── SSP3-7.0 — Regional Rivalry ─────────────────────────────────────────────
# Narrative: fragmented world with low economic convergence, high population
# growth in developing regions, and high barriers to trade and technology
# transfer. Weak climate governance; fossil fuels dominate. ~3–4 °C trajectory.
#
# Project links:
#   Africa Proj_002 (hospital) faces financing constraints — slow deployment.
#   Hydro retrofits are delayed or partial. Rail_EU_DEV is an exception
#   (Europe retains strong domestic institutions despite global fragmentation).
#
# Merges with base.yaml via Model.from_yaml("base.yaml", "ssp3.yaml").

# ── Electricity demand [PJ/yr] — high growth, especially Global South ──────
commodities:
  - id: ELC
    include_in_joint_renewable_target:
      "*":
        "*": true
    demand_annual:
      Africa:
        "2020": 2500
        "2025": 3200
        "2030": 4150
